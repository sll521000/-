<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#e8e0cf"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="transparent"/>
      <line x1="0" y1="0" x2="44" y2="0" stroke="#1a1612" stroke-opacity="0.04" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="44" stroke="#1a1612" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 左上品牌 -->
  <g transform="translate(80, 80)">
    <rect width="68" height="68" rx="34" fill="#1a1612"/>
    <text x="34" y="48" text-anchor="middle"
          font-family="Noto Serif SC, Cormorant Garamond, serif"
          font-size="40" font-weight="900" fill="#fffdf8">麒</text>
    <text x="100" y="38" font-family="Cormorant Garamond, serif"
          font-size="32" font-weight="700" fill="#1a1612">麒麟</text>
    <text x="100" y="62" font-family="Inter, sans-serif"
          font-size="14" font-weight="600" fill="#1a1612" opacity="0.62" letter-spacing="0.2em">A CONTINUOUS OPERATOR</text>
  </g>

  <!-- 大标题 -->
  <g transform="translate(80, 270)">
    <text font-family="Noto Serif SC, Cormorant Garamond, serif"
          font-size="92" font-weight="900" fill="#1a1612" letter-spacing="-0.02em">
      <tspan x="0" y="0">把成长、资源、AI</tspan>
      <tspan x="0" y="108">和连接整理成一个</tspan>
      <tspan x="0" y="216" fill="#254d47">清晰入口。</tspan>
    </text>
  </g>

  <!-- 底部信息 -->
  <g transform="translate(80, 560)">
    <rect width="14" height="14" rx="3" fill="#b95e32"/>
    <text x="28" y="12" font-family="Inter, sans-serif"
          font-size="18" font-weight="700" fill="#1a1612" opacity="0.62">
      qilin · 个人站 · 2026
    </text>
  </g>

  <!-- 右下装饰 -->
  <g transform="translate(1080, 540)" opacity="0.85">
    <circle r="40" fill="none" stroke="#254d47" stroke-width="2"/>
    <text text-anchor="middle" y="6" font-family="Cormorant Garamond, serif"
          font-size="20" fill="#254d47" font-weight="700">v0.2</text>
  </g>
</svg>
